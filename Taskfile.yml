version: '3'
silent: true

env:
  AWS_PROFILE: lab

tasks:

  default:
    cmds:
      - task -l

  # ─── Docs ──────────────────────────────────────────────────────────────────

  docs:download:
    desc: Download AWS service documentation PDFs to data/aws-docs/
    cmds:
      - uv run scripts/download_aws_docs.py

  docs:upload:
    desc: Upload PDFs to the scenario-01 corpus bucket under docs/ (staggered to avoid a thundering-herd ingestion burst)
    cmds:
      - |
        BUCKET=$(terraform -chdir=scenario-01-embeddings output -raw corpus_bucket_name)
        for pdf in data/aws-docs/*.pdf; do
          name=$(basename "$pdf")
          echo "→ uploading $name"
          aws s3 cp "$pdf" "s3://$BUCKET/pdfs/$name"
          sleep 15
        done

  # ─── OpenSearch ───────────────────────────────────────────────────────────

  opensearch:query:
    desc: "Query OpenSearch index from scenario-01 (args: [size=1] [source_key])"
    cmds:
      - |
        export OS_ENDPOINT=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_collection_endpoint)
        export OS_INDEX=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_index_name)
        uv run scripts/query_opensearch.py {{.CLI_ARGS}}

  opensearch:knn:
    desc: "KNN search against OpenSearch index from scenario-01 (args: <question>)"
    cmds:
      - |
        export OS_ENDPOINT=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_collection_endpoint)
        export OS_INDEX=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_index_name)
        uv run scripts/knn_search.py {{.CLI_ARGS}}

  # ─── Status ─────────────────────────────────────────────────────────────────

  status:all:
    desc: Print built/destroyed status for every scenario (state file resource count)
    silent: true
    cmds:
      - |
        for dir in scenario-01-embeddings scenario-02-knowledge-bases scenario-03-advanced-retrieval \
                   scenario-04-prompt-management scenario-05-guardrails scenario-06-governance \
                   scenario-07-cost-optimization scenario-08-model-evaluation scenario-09-troubleshooting \
                   scenario-10-cicd; do
          if [ -f "$dir/terraform.tfstate" ] && jq -e '.resources | length > 0' "$dir/terraform.tfstate" > /dev/null 2>&1; then
            printf "%-32s built\n" "$dir"
          else
            printf "%-32s destroyed\n" "$dir"
          fi
        done

  # ─── Teardown ──────────────────────────────────────────────────────────────

  teardown:all:
    desc: Destroy every deployed scenario in dependency-safe order
    cmds:
      - |
        has_resources() {
          [ -f "$1/terraform.tfstate" ] && \
            jq -e '.resources | length > 0' "$1/terraform.tfstate" > /dev/null 2>&1
        }
        destroy_if_deployed() {
          if has_resources "$1"; then
            echo "→ destroying $1"
            terraform -chdir="$1" destroy -auto-approve
          else
            echo "  skipping $1 (not deployed)"
          fi
        }
        # Dependents of scenario-01 must go first. scenario-06 also reads
        # scenario-04's outputs via terraform_remote_state (Glue table
        # locations), so it must be destroyed before scenario-04 too.
        destroy_if_deployed scenario-03-advanced-retrieval
        destroy_if_deployed scenario-02-knowledge-bases
        destroy_if_deployed scenario-09-troubleshooting
        destroy_if_deployed scenario-06-governance
        # scenario-01 after its dependents are gone (index submodule must go before the collection)
        if has_resources scenario-01-embeddings; then
          echo "→ destroying scenario-01-embeddings (and its index)"
          task scenario-01:down
        else
          echo "  skipping scenario-01-embeddings (not deployed)"
        fi
        destroy_if_deployed scenario-04-prompt-management
        # Independent scenarios — order doesn't matter
        for dir in scenario-05-guardrails scenario-07-cost-optimization scenario-08-model-evaluation scenario-10-cicd; do
          destroy_if_deployed "$dir"
        done

  # ─── Internal sentinel ─────────────────────────────────────────────────────
  # Scenarios 02, 03, 06, and 09 call this task as a dependency. It runs
  # scenario-01:up only when the state has no resources yet.

  _ensure-01:
    internal: true
    cmds:
      - task: scenario-01:up
    status:
      - test -f scenario-01-embeddings/terraform.tfstate && jq -e '.resources | length > 0' scenario-01-embeddings/terraform.tfstate > /dev/null

  # Scenario 05's test task calls this task as a dependency. It runs
  # scenario-05:up only when the state has no resources yet.

  _ensure-05:
    internal: true
    cmds:
      - task: scenario-05:up
    status:
      - test -f scenario-05-guardrails/terraform.tfstate && jq -e '.resources | length > 0' scenario-05-guardrails/terraform.tfstate > /dev/null

  # Scenario 06 calls this task as a dependency. It runs scenario-04:up only
  # when the state has no resources yet — scenario-06 relies on scenario-04
  # for account-level Model Invocation Logging, which it does not configure itself.

  _ensure-04:
    internal: true
    cmds:
      - task: scenario-04:up
    status:
      - test -f scenario-04-prompt-management/terraform.tfstate && jq -e '.resources | length > 0' scenario-04-prompt-management/terraform.tfstate > /dev/null

  # ─── Scenario 01 — Embeddings ─────────────────────────────────────────────

  scenario-01:plan:
    desc: Preview scenario-01-embeddings changes
    cmds:
      - terraform -chdir=scenario-01-embeddings init -input=false
      - terraform -chdir=scenario-01-embeddings plan

  scenario-01:up:
    desc: Deploy scenario-01-embeddings (collection, queues, lambdas, then the OpenSearch index)
    cmds:
      - docker pull --platform linux/arm64 ghcr.io/astral-sh/uv:python3.13-bookworm-slim
      - terraform -chdir=scenario-01-embeddings init -input=false
      - terraform -chdir=scenario-01-embeddings apply -auto-approve
      - terraform -chdir=scenario-01-embeddings/index init -input=false
      - |
        terraform -chdir=scenario-01-embeddings/index apply -auto-approve \
          -var opensearch_endpoint=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_collection_endpoint) \
          -var opensearch_index_name=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_index_name)

  scenario-01:down:
    desc: Destroy scenario-01-embeddings (the OpenSearch index first, then the collection it lives in)
    cmds:
      - |
        if [ -f scenario-01-embeddings/index/terraform.tfstate ]; then
          terraform -chdir=scenario-01-embeddings/index destroy -auto-approve \
            -var opensearch_endpoint=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_collection_endpoint) \
            -var opensearch_index_name=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_index_name)
        fi
      - terraform -chdir=scenario-01-embeddings destroy -auto-approve

  # ─── Scenario 02 — Knowledge Bases ────────────────────────────────────────

  scenario-02:plan:
    desc: Preview scenario-02-knowledge-bases changes (deploys scenario-01 if absent)
    deps: [_ensure-01]
    cmds:
      - terraform -chdir=scenario-02-knowledge-bases init -input=false
      - terraform -chdir=scenario-02-knowledge-bases plan

  scenario-02:up:
    desc: Deploy scenario-02-knowledge-bases (deploys scenario-01 if absent)
    deps: [_ensure-01]
    cmds:
      - terraform -chdir=scenario-02-knowledge-bases init -input=false
      - terraform -chdir=scenario-02-knowledge-bases apply -auto-approve

  scenario-02:sync:
    desc: Start a Bedrock Knowledge Base ingestion job for scenario-02
    cmds:
      - |
        KB_ID=$(terraform -chdir=scenario-02-knowledge-bases output -raw knowledge_base_id)
        DS_ID=$(terraform -chdir=scenario-02-knowledge-bases output -raw data_source_id)
        aws bedrock-agent start-ingestion-job --knowledge-base-id "$KB_ID" --data-source-id "$DS_ID"

  scenario-02:retrieve:
    desc: "Retrieve + generate an answer from Bedrock Knowledge Base in scenario-02, guarded if scenario-05 is deployed (args: <question>)"
    cmds:
      - |
        export KB_ID=$(terraform -chdir=scenario-02-knowledge-bases output -raw knowledge_base_id)
        uv run scripts/kb_retrieve.py {{.CLI_ARGS}}

  scenario-02:down:
    desc: Destroy scenario-02-knowledge-bases
    cmds:
      - terraform -chdir=scenario-02-knowledge-bases destroy -auto-approve

  # ─── Scenario 03 — Advanced Retrieval ─────────────────────────────────────

  scenario-03:plan:
    desc: Preview scenario-03-advanced-retrieval changes (deploys scenario-01 if absent)
    deps: [_ensure-01]
    cmds:
      - terraform -chdir=scenario-03-advanced-retrieval init -input=false
      - terraform -chdir=scenario-03-advanced-retrieval plan

  scenario-03:up:
    desc: Deploy scenario-03-advanced-retrieval (deploys scenario-01 if absent)
    deps: [_ensure-01]
    cmds:
      - docker pull --platform linux/arm64 public.ecr.aws/sam/build-python3.13
      - terraform -chdir=scenario-03-advanced-retrieval init -input=false
      - terraform -chdir=scenario-03-advanced-retrieval apply -auto-approve

  scenario-03:hybrid:
    desc: "Hybrid (BM25 + kNN) search against scenario-01 index (args: [--rerank] [--query-expansion] <question>)"
    cmds:
      - |
        export OS_ENDPOINT=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_collection_endpoint)
        export OS_INDEX=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_index_name)
        export DDB_TABLE_NAME=$(terraform -chdir=scenario-04-prompt-management output -raw prompt_registry_table_name 2>/dev/null || true)
        uv run scripts/hybrid_search.py {{.CLI_ARGS}}

  scenario-03:compare:
    desc: "Compare kNN vs hybrid search for the same query (args: <question>)"
    cmds:
      - |
        export OS_ENDPOINT=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_collection_endpoint)
        export OS_INDEX=$(terraform -chdir=scenario-01-embeddings output -raw opensearch_index_name)
        export DDB_TABLE_NAME=$(terraform -chdir=scenario-04-prompt-management output -raw prompt_registry_table_name 2>/dev/null || true)
        echo ""
        echo "════ kNN only ════════════════════════════════════════════════"
        uv run scripts/knn_search.py {{.CLI_ARGS}}
        echo ""
        echo "════ Hybrid (BM25=${BM25_WEIGHT:-0.3} / kNN=${KNN_WEIGHT:-0.7}) ══════════════"
        uv run scripts/hybrid_search.py {{.CLI_ARGS}}

  scenario-03:query:
    desc: "Run the RAG pipeline state machine and print results (args: <question>)"
    cmds:
      - |
        SFN_ARN=$(terraform -chdir=scenario-03-advanced-retrieval output -raw state_machine_arn)
        INPUT=$(jq -n --arg q "{{.CLI_ARGS}}" '{"question": $q}')
        aws stepfunctions start-sync-execution \
          --state-machine-arn "$SFN_ARN" \
          --input "$INPUT" \
          --output json | jq 'if .status == "SUCCEEDED" then .output | fromjson else {status: .status, error: .error, cause: .cause} end'

  scenario-03:down:
    desc: Destroy scenario-03-advanced-retrieval
    cmds:
      - terraform -chdir=scenario-03-advanced-retrieval destroy -auto-approve

  # ─── Scenario 04 — Prompt Management ─────────────────────────────────────

  scenario-04:plan:
    desc: Preview scenario-04-prompt-management changes
    cmds:
      - terraform -chdir=scenario-04-prompt-management init -input=false
      - terraform -chdir=scenario-04-prompt-management plan

  scenario-04:up:
    desc: Deploy scenario-04-prompt-management
    cmds:
      - terraform -chdir=scenario-04-prompt-management init -input=false
      - terraform -chdir=scenario-04-prompt-management apply -auto-approve

  scenario-04:down:
    desc: Destroy scenario-04-prompt-management
    cmds:
      - terraform -chdir=scenario-04-prompt-management destroy -auto-approve

  # ─── Scenario 05 — Guardrails ─────────────────────────────────────────────

  scenario-05:plan:
    desc: Preview scenario-05-guardrails changes
    cmds:
      - terraform -chdir=scenario-05-guardrails init -input=false
      - terraform -chdir=scenario-05-guardrails plan

  scenario-05:up:
    desc: Deploy scenario-05-guardrails
    cmds:
      - terraform -chdir=scenario-05-guardrails init -input=false
      - terraform -chdir=scenario-05-guardrails apply -auto-approve

  scenario-05:down:
    desc: Destroy scenario-05-guardrails
    cmds:
      - terraform -chdir=scenario-05-guardrails destroy -auto-approve

  scenario-05:test:
    desc: "Probe the scenario-05 guardrail with adversarial, benign, and grounding inputs (deploys scenario-05 if absent; grounding case needs scenario-02 deployed)"
    deps: [_ensure-05]
    cmds:
      - |
        export KB_ID=$(terraform -chdir=scenario-02-knowledge-bases output -raw knowledge_base_id 2>/dev/null || true)
        uv run scripts/test_guardrails.py

  # ─── Scenario 06 — Governance ─────────────────────────────────────────────

  scenario-06:plan:
    desc: Preview scenario-06-governance changes (deploys scenario-01 and scenario-04 if absent)
    deps: [_ensure-01, _ensure-04]
    cmds:
      - terraform -chdir=scenario-06-governance init -input=false
      - terraform -chdir=scenario-06-governance plan

  scenario-06:up:
    desc: Deploy scenario-06-governance (deploys scenario-01 and scenario-04 if absent)
    deps: [_ensure-01, _ensure-04]
    cmds:
      - terraform -chdir=scenario-06-governance init -input=false
      - terraform -chdir=scenario-06-governance apply -auto-approve

  scenario-06:down:
    desc: Destroy scenario-06-governance
    cmds:
      - terraform -chdir=scenario-06-governance destroy -auto-approve

  scenario-06:query:
    desc: "Run a sample Athena query over Bedrock invocation logs — call/error counts and avg token counts by model (requires scenario-06 deployed)"
    cmds:
      - |
        DB=$(terraform -chdir=scenario-06-governance output -raw glue_database_name)
        WG=$(terraform -chdir=scenario-06-governance output -raw athena_workgroup_name)
        QUERY='SELECT modelid, COUNT(*) AS invocation_count, COUNT_IF(errorcode IS NOT NULL) AS error_count, ROUND(AVG(input.inputtokencount), 1) AS avg_input_tokens, ROUND(AVG(output.outputtokencount), 1) AS avg_output_tokens FROM invocation_logs GROUP BY modelid ORDER BY invocation_count DESC'

        QUERY_ID=$(aws athena start-query-execution \
          --query-string "$QUERY" \
          --query-execution-context Database="$DB" \
          --work-group "$WG" \
          --output text --query 'QueryExecutionId')
        echo "→ query execution id: $QUERY_ID"

        while true; do
          STATE=$(aws athena get-query-execution --query-execution-id "$QUERY_ID" --query 'QueryExecution.Status.State' --output text)
          case "$STATE" in
            SUCCEEDED) break ;;
            FAILED|CANCELLED)
              echo "query $STATE:"
              aws athena get-query-execution --query-execution-id "$QUERY_ID" --query 'QueryExecution.Status.StateChangeReason' --output text
              exit 1
              ;;
          esac
          sleep 2
        done

        # NULL cells (e.g. avg token counts for a model with only throttled/errored
        # invocations) come back with no VarCharValue key at all rather than an
        # empty string, so `Data[*].VarCharValue` silently drops that position and
        # rows go ragged. map() over each row's Data array fills those gaps with
        # "NULL" instead of skipping them, keeping every row the same width.
        aws athena get-query-results --query-execution-id "$QUERY_ID" --output json \
          | jq -r '.ResultSet.Rows[] | .Data | map(.VarCharValue // "NULL") | @tsv' \
          | column -t -s $'\t'

  scenario-06:trail-tail:
    desc: "Print the last N events (default 20) delivered to the scenario-06 CloudTrail trail, across both management and data event categories (args: [N])"
    cmds:
      - |
        N={{.CLI_ARGS}}
        N=${N:-20}
        BUCKET=$(terraform -chdir=scenario-06-governance output -raw cloudtrail_logs_bucket_name)
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT

        # CloudTrail batches delivery every few minutes into many small files —
        # grab the most recently-delivered ones rather than the whole prefix.
        # Excludes zero-byte "folder marker" keys and CloudTrail-Digest/ files
        # (log-file-validation digests — a different JSON shape, not .Records).
        aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "AWSLogs/" \
          --query "reverse(sort_by(Contents[?ends_with(Key, \`.json.gz\`) && !contains(Key, \`CloudTrail-Digest\`)], &LastModified))[:20].Key" \
          --output text \
          | tr '\t' '\n' \
          | while read -r key; do
              [ -n "$key" ] && aws s3 cp "s3://$BUCKET/$key" "$TMPDIR/" --only-show-errors
            done

        printf "%-24s  %-10s  %-24s  %s\n" "eventTime" "category" "eventSource" "eventName"
        gunzip -c "$TMPDIR"/*.json.gz \
          | jq -s '[.[].Records[]] | sort_by(.eventTime) | reverse | .[:'"$N"']
              | .[] | [.eventTime, .eventCategory, .eventSource, .eventName] | @tsv' -r \
          | column -t -s $'\t'

  # ─── Scenario 07 — Cost Optimization ─────────────────────────────────────

  scenario-07:plan:
    desc: Preview scenario-07-cost-optimization changes
    cmds:
      - terraform -chdir=scenario-07-cost-optimization init -input=false
      - terraform -chdir=scenario-07-cost-optimization plan

  scenario-07:up:
    desc: Deploy scenario-07-cost-optimization
    cmds:
      - terraform -chdir=scenario-07-cost-optimization init -input=false
      - terraform -chdir=scenario-07-cost-optimization apply -auto-approve

  scenario-07:down:
    desc: Destroy scenario-07-cost-optimization
    cmds:
      - terraform -chdir=scenario-07-cost-optimization destroy -auto-approve

  # ─── Scenario 08 — Model Evaluation ──────────────────────────────────────

  scenario-08:plan:
    desc: Preview scenario-08-model-evaluation changes
    cmds:
      - terraform -chdir=scenario-08-model-evaluation init -input=false
      - terraform -chdir=scenario-08-model-evaluation plan

  scenario-08:up:
    desc: Deploy scenario-08-model-evaluation
    cmds:
      - terraform -chdir=scenario-08-model-evaluation init -input=false
      - terraform -chdir=scenario-08-model-evaluation apply -auto-approve

  scenario-08:down:
    desc: Destroy scenario-08-model-evaluation
    cmds:
      - terraform -chdir=scenario-08-model-evaluation destroy -auto-approve

  # ─── Scenario 09 — Troubleshooting ────────────────────────────────────────

  scenario-09:plan:
    desc: Preview scenario-09-troubleshooting changes (deploys scenario-01 if absent)
    deps: [_ensure-01]
    cmds:
      - terraform -chdir=scenario-09-troubleshooting init -input=false
      - terraform -chdir=scenario-09-troubleshooting plan

  scenario-09:up:
    desc: Deploy scenario-09-troubleshooting (deploys scenario-01 if absent)
    deps: [_ensure-01]
    cmds:
      - terraform -chdir=scenario-09-troubleshooting init -input=false
      - terraform -chdir=scenario-09-troubleshooting apply -auto-approve

  scenario-09:down:
    desc: Destroy scenario-09-troubleshooting
    cmds:
      - terraform -chdir=scenario-09-troubleshooting destroy -auto-approve

  # ─── Scenario 10 — CI/CD ─────────────────────────────────────────────────

  scenario-10:plan:
    desc: Preview scenario-10-cicd changes
    cmds:
      - terraform -chdir=scenario-10-cicd init -input=false
      - terraform -chdir=scenario-10-cicd plan

  scenario-10:up:
    desc: Deploy scenario-10-cicd
    cmds:
      - terraform -chdir=scenario-10-cicd init -input=false
      - terraform -chdir=scenario-10-cicd apply -auto-approve

  scenario-10:down:
    desc: Destroy scenario-10-cicd
    cmds:
      - terraform -chdir=scenario-10-cicd destroy -auto-approve
